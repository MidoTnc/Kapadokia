name: 벌룬 운항 기록 수집

on:
  schedule:
    # 하루 2번: 05:00 UTC(이스탄불 08:00, 운항창 열려 있을 때) + 07:00 UTC(10:00, 확정 후 재확인).
    # 판독기가 "flew 05:30–09:30" 같은 실제 비행 시간을 최우선으로 보므로 늦은 실행도 안전하다.
    - cron: "0 5,7 * * *"
  workflow_dispatch:
    inputs:
      climatology:
        description: "기후값도 다시 계산 (15년치 · 몇 분 걸림 · 평소엔 불필요)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: balloon-log
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 오늘 운항 여부 수집
        run: node scripts/scrape.mjs

      - name: 다른 사이트 예보 수집
        run: node scripts/peers.mjs
        continue-on-error: true

      # 과거 날씨는 변하지 않으므로 평소엔 돌릴 필요가 없다.
      # 이 파일이 있어야 방문자마다 15년치를 새로 받지 않는다 (API 호출 수백 건 절약).
      - name: 기후값 계산 (파일이 없거나 요청했을 때만)
        if: github.event.inputs.climatology == 'true' || hashFiles('data/climatology.json') == ''
        run: node scripts/climatology.mjs

      - name: 변경분 커밋
        run: |
          git config user.name  "balloon-log"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "기록 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
