name: 벌룬 운항 기록 수집

on:
  schedule:
    # 매일 07:00 UTC = 이스탄불 10:00. 그날 운항 여부가 확정된 뒤에 돈다.
    - cron: "0 7 * * *"
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: balloon-log
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 운항 여부 수집
        run: node scripts/scrape.mjs

      - name: 변경분 커밋
        run: |
          git config user.name  "balloon-log"
          git config user.email "actions@users.noreply.github.com"
          git add data/log.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "기록 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
